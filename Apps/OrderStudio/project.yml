name: OrderStudio

options:
  bundleIdPrefix: io.kamilkkowalski
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Shared: { path: ../../Packages/Shared }
  OrderStudioCore: { path: ../../Packages/OrderStudioCore }
  OrderStudioUI: { path: ../../Packages/OrderStudioUI }
  OrderStudioFeatures: { path: ../../Packages/OrderStudioFeatures }

targets:
  OrderStudio:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/App
        name: Sources
        type: group
      - path: Resources
        name: Resources
        type: group
    settings:
      base:
        PRODUCT_NAME: Order Studio
        PRODUCT_BUNDLE_IDENTIFIER: io.kamilkkowalski.OrderStudio
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      debug:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
        ENABLE_TESTABILITY: YES
        ONLY_ACTIVE_ARCH: YES
      release:
        SWIFT_COMPILATION_MODE: wholemodule
        VALIDATE_PRODUCT: YES
    dependencies:
      - package: Shared
      - package: OrderStudioCore
      - package: OrderStudioUI
      - package: OrderStudioFeatures
      - target: OrderStudioWidgetExtension   # embedded automatically

  OrderStudioWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Widget
    settings:
      base:
        PRODUCT_NAME: OrderStudioWidget
        PRODUCT_BUNDLE_IDENTIFIER: io.kamilkkowalski.OrderStudio.Widget
        INFOPLIST_FILE: Resources/Widget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: Shared

schemes:
  OrderStudio:
    build:
      targets:
        OrderStudio: all
    run: { config: Debug }
    test: { config: Debug }
    profile: { config: Release }
    analyze: { config: Debug }
    archive: { config: Release }